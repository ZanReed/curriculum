name: check

# The four boundary checks (spec: Curriculum -> Platform, 2026-09-02).
# Every step fails red on a missing file — nothing here is skippable,
# because a skipped check reads as a passed one from the other side of
# the boundary. Green on main is what the boundary page's stamp row
# claims; this workflow is what makes the claim true by construction.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the glossary step compares against the base commit
          # (retire-not-rename, D40), so a shallow clone would fail it.
          fetch-depth: 0

      - name: "Check 1 — authoring_principles byte-identical to authoring-principles.md"
        run: python3 scripts/check_principles.py curriculum-graph.json authoring-principles.md

      - name: "Check 2 — regenerating the registries produces no diff"
        # chain-registry.txt is deliberately excluded: its display titles
        # are authored prose with no source in the graph (spec §1.2 note).
        run: |
          python3 generate-registries.py curriculum-graph.json
          git diff --exit-code -- skill-registry.txt misconception-registry.txt external-prereq-registry.txt misconception-attachments.txt

      - name: "Check 3 — partition-check passes (prose restates no threshold, D25)"
        # Invocation to confirm against the seeded script; if it takes no
        # argument or a different one, fix THIS line, not the script.
        run: python3 partition-check.py curriculum-graph.json

      - name: "Check 4 — referential integrity (graph + registries)"
        run: python3 scripts/check_integrity.py curriculum-graph.json

      - name: "Thread checks — validate.js (curriculum-owned §11 rules)"
        # Joined per the curriculum side's criterion (2026-09-02): the one
        # implementation of the thread checks belongs with the graph it
        # validates, under the same CI.
        run: node validate.js curriculum-graph.json

      - name: "Fact-scope registry — regenerates with no diff, contract gate (D43)"
        # The generator is also the gate: it fails, writing nothing, on any
        # contract violation (kinds, flags, placeholders, ids, retired ids,
        # answer characters, fraction names, markup, year placement).
        run: |
          python3 scripts/generate_fact_registry.py curriculum-graph.json --retired fact-ids-retired.txt
          git diff --exit-code -- fact-scope-registry.json

      - name: "Capabilities — derived fields match the pinned platform facts, shape check (B14)"
        # Gated against the PINNED copy in platform-pins/, never a live fetch:
        # green here must be decidable from this repo's own artifacts. The
        # scheduled capability-drift.yml reports when the platform moves on.
        run: |
          python3 scripts/check_capabilities.py curriculum-graph.json \
            --facts platform-pins/capability-facts.json \
            --pin platform-pins/capability-facts.pin.json

      - name: "Glossary — well-formed, unique, NZ-only bodies, retire-not-rename (D40)"
        # The base is the PR's base commit, or the previous tip of main on a
        # push. A base git cannot resolve FAILS the step; it never skips.
        run: |
          python3 scripts/check_glossary.py glossary.md --retired glossary-retired.txt \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: "Teacher guides — the check script against its fixture catalogue (D50)"
        # Real guides live in the catalogue, which has no CI; the check runs there
        # before every batch import. This step keeps the script itself working.
        run: python3 scripts/check_guides.py tests/fixtures/guides-catalogue --graph curriculum-graph.json
